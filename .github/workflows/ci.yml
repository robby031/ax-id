name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Catch new warnings as errors in CI without forcing local builds to fail.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.toolchain }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.os }}
      - name: Build (default features)
        run: cargo build --verbose
      - name: Test (default features)
        run: cargo test --verbose
      - name: Test (release)
        run: cargo test --release --verbose

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # `--each-feature` builds with every feature alone, then with none,
      # then with all defaults. Catches feature-gated breakage without
      # exploding into the full powerset (which would be slow with
      # diesel/sqlx/sea-orm all pulled in together).
      - name: cargo hack --each-feature
        run: cargo hack check --each-feature --no-dev-deps
      # One pass with everything turned on, including dev-deps, to make
      # sure the integration impls compile together.
      - name: build all features
        run: cargo build --all-features --all-targets

  no_std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Bare-metal target with no std. Verifies the no_std core path
      # (the `std`/`cli`/`sqlx`/`diesel`/`sea-orm` features all require std).
      - name: Build core for thumbv7em-none-eabihf
        run: cargo build --target thumbv7em-none-eabihf --no-default-features

  miri:
    name: miri
    runs-on: ubuntu-latest
    env:
      # Disable isolation so SystemTime/env vars work; strict provenance
      # catches the kind of pointer shenanigans used in the diesel impl.
      MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - name: cargo miri setup
        run: cargo miri setup
      # Skip the heavy stress/proptest cases — miri is ~100× slower and
      # those tests are about volume, not correctness of unsafe code.
      - name: miri test (lib, default features)
        run: |
          cargo miri test --lib -- \
            --skip stress_tests::high_volume \
            --skip stress_tests::multi_thread \
            --skip uniqueness_single_thread \
            --skip no_duplicate_generation
      - name: miri test (diesel unsafe path)
        run: cargo miri test --lib --features diesel -- --skip stress_tests

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  msrv-check:
    name: MSRV check (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # `cargo check` is enough here; the test job already runs full tests
      # on 1.85 across all three OSes.
      - run: cargo check --all-features --all-targets
